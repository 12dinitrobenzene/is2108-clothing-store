{% extends "shop/layouts/base.html" %}

{% block body %}
<nav class="navbar navbar-expand-lg customer-navbar"
     aria-label="Customer navigation">
    <div class="container customer-nav-layout">
        <a class="navbar-brand customer-brand"
           href="{% url 'shop:catalogue' %}">
            Clothing Store
        </a>
        {% include "accounts/components/account_menu.html" %}
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
<footer class="border-top py-3">
    <div class="container text-muted">
        {% block footer %}Clothing Store{% endblock %}
    </div>
</footer>
{% endblock %}
