<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Clothing Store{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    {% load static %}
    <link href="{% static 'shop/css/site.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if messages %}
        <div class="container pt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} mb-0" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'shop/js/site.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
