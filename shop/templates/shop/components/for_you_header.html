{% load static %}

<header class="for-you-header">
    <nav aria-label="Breadcrumb" class="small text-secondary mb-5">
        <a href="{% url 'shop:catalogue' %}">Discover</a>
        <span aria-hidden="true"> / </span>
        <span>For you</span>
    </nav>

    <div class="row g-5 align-items-center">
        <div class="col-lg-9">
            <p class="for-you-eyebrow">YOUR PERSONAL EDIT</p>

            <h1 class="for-you-title">
                A wardrobe with<br>
                you in mind.
            </h1>

            <p class="for-you-description">
                Bold silhouettes. Statement pieces. Occasion-led edits.
                Discover clothing inspired by your style.
            </p>

            <a href="{% url 'shop:style_preferences' %}"
               class="btn for-you-preferences">
                UPDATE PREFERENCES
                <span class="ms-4" aria-hidden="true">↗</span>
            </a>
        </div>

        <div class="col-lg-3">
            <figure class="for-you-feature mb-0">
                <img
                    src="{% static 'shop/images/ant-man.png' %}"
                    alt="Occasionwear inspiration">

                <figcaption>The occasion edit</figcaption>
            </figure>
        </div>
    </div>

    <div class="for-you-filters">
        <span class="for-you-filter-active">ALL FOR YOU</span>
    </div>
</header>
