<section class="for-you-catalogue py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">For you</h2>
        <a href="{% url 'shop:full_catalogue' %}">Discover all clothing</a>
    </div>

    <div class="row g-4">
        {% for product in products %}
            <div class="col-sm-6 col-lg-3">
                {% include "shop/components/product_card.html" with product=product only %}
            </div>
        {% empty %}
            <p class="text-muted">No clothing is available yet.</p>
        {% endfor %}
    </div>
</section>
