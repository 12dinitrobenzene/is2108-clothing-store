<article class="card h-100">
    {% if product.image %}
        <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
    {% endif %}
    <div class="card-body">
        <h2 class="card-title h5">{{ product.name }}</h2>
        {% if product.price %}<p class="card-text">${{ product.price }}</p>{% endif %}
        {% block product_card_actions %}{% endblock %}
    </div>
</article>
