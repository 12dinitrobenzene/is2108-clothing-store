<section class="featured-vendors py-5">
    <h2 class="h3 mb-4">Featured vendors</h2>

    <div class="row g-3">
        {% for vendor in featured_vendors %}
            <div class="col-sm-6 col-lg-3">
                <article class="border rounded p-3 h-100">
                    <h3 class="h5 mb-0">{{ vendor.name }}</h3>
                </article>
            </div>
        {% empty %}
            <p class="text-muted">Featured vendors will appear here.</p>
        {% endfor %}
    </div>
</section>
